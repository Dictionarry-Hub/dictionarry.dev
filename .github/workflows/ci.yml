name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

# Every job pays about 25 seconds of setup (checkout, pnpm, Node, install),
# while the compile step is about 12 seconds. So the compiled data is
# produced inline wherever it is needed rather than passed around as an
# artifact, and the prerendered site (hundreds of MB) never leaves the job
# that built it.
jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  standalone: true
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  standalone: true
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm test

    type-check:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  standalone: true
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm compile:api
            - run: pnpm compile:pcd
            - run: pnpm check

    # Build and Lint share a job because the custom lint rules read the
    # prerendered HTML in build/. Uploading that output as an artifact and
    # downloading it into a second job cost more than lint itself.
    build:
        name: Build + Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  standalone: true
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm compile:api
            - run: pnpm compile:pcd
            - run: pnpm build
            - run: pnpm lint
